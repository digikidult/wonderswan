<!doctype html><html lang="zh-HK"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>DigiKidult 內容管理</title><link rel="icon" href="assets/mark.svg"><link rel="stylesheet" href="cms.css"><script defer src="projects.js"></script><script defer src="cms-utils.js"></script><script defer src="cms.js"></script></head><body><aside class="site-reminder" aria-label="使用提醒"><p>所有作品僅供學習交流，個人參考，非盈利使用。<br>一律只提供 Patch 檔，遊戲文件請「自行備份」取得。</p></aside>
<header><a href="index.html">DigiKidult <small>內容管理 CMS</small></a><span id="save-state" role="status">載入中…</span></header>
<div class="intro"><h1>網站內容，由你更新。</h1><p>改動會儲存在此瀏覽器。匯出更新 ZIP，再將內容覆蓋上傳到 GitHub 網站根目錄，先會更新公開網站。</p><div class="actions"><button id="export-zip" class="primary">匯出網站更新 ZIP</button><button id="preview">預覽改動</button><button id="backup">備份草稿 JSON</button><label class="file-button">匯入草稿 JSON<input id="import-backup" type="file" accept=".json,application/json" hidden></label><button id="reset">重新載入網站資料</button></div><p id="feedback" role="status"></p></div>
<main><aside><label for="project-select">選擇作品</label><select id="project-select"></select><p class="hint">作品 ID 保持不變，以免原有連結失效。</p><div id="file-list"></div></aside><form id="editor" novalidate></form></main>
<dialog id="preview-dialog"><div class="dialog-bar"><strong>草稿預覽 · 未發佈</strong><button id="close-preview">關閉預覽</button></div><iframe id="preview-frame" title="作品頁草稿預覽"></iframe></dialog>
<footer>此工具沒有伺服器登入或寫入權限。訪客開啟 CMS 只能改自己瀏覽器的草稿，無法修改你的 GitHub 網站。</footer></body></html>
